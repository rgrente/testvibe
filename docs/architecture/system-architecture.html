*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Geist,sans-serif}.page{max-width:1120px;margin:auto;padding:32px}.eyebrow{font:500 8px 'Geist Mono',monospace;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin:0 0 8px}.page h1{font:400 32px 'Instrument Serif',serif;margin:0 0 20px}.frame{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--paper);padding:16px}svg{display:block;width:100%;min-width:960px;height:auto}.node{fill:#fff;stroke:var(--ink);stroke-width:1}.store{fill:rgba(45,49,66,.05);stroke:var(--muted)}.external{fill:rgba(45,49,66,.03);stroke:rgba(45,49,66,.3);stroke-dasharray:4 3}.focal{fill:rgba(235,108,54,.08);stroke:var(--accent);stroke-width:1.2}.zone{fill:rgba(45,49,66,.02);stroke:rgba(45,49,66,.12);stroke-width:.8}.name{font:600 12px Geist,sans-serif;fill:var(--ink)}.sub{font:400 9px 'Geist Mono',monospace;fill:var(--muted)}.tag{font:500 8px 'Geist Mono',monospace;letter-spacing:.12em;fill:var(--soft)}.arrow{fill:none;stroke:var(--muted);stroke-width:1.2;marker-end:url(#arch-arrow)}.arrow-link{fill:none;stroke:var(--link);stroke-width:1.2;marker-end:url(#arch-arrow-link)}.arrow-accent{fill:none;stroke:var(--accent);stroke-width:1.2;marker-end:url(#arch-arrow-accent)}.label-mask{fill:var(--paper)}.label{font:500 8px 'Geist Mono',monospace;letter-spacing:.06em;fill:var(--soft)}
