<rect class="zone" x="240" y="60" width="468" height="348" rx="8"/><rect class="label-mask" x="256" y="64" width="88" height="16" rx="2"/><text class="tag" x="300" y="76" text-anchor="middle">APPLICATION</text>
<rect class="zone" x="744" y="60" width="268" height="348" rx="8"/><rect class="label-mask" x="760" y="64" width="64" height="16" rx="2"/><text class="tag" x="792" y="76" text-anchor="middle">DONNÉES</text>
