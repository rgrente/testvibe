<rect class="node" x="52" y="264" width="132" height="72" rx="6"/><text class="tag" x="64" y="280">ADMIN</text><text class="name" x="118" y="302" text-anchor="middle">Mode édition</text><text class="sub" x="118" y="318" text-anchor="middle">session protégée</text>
