<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-labelledby="main-flows-title main-flows-desc">
<title id="main-flows-title">Flux principaux de TestVibe</title>
<desc id="main-flows-desc">Trois flux montrent la consultation publique, les mutations administratives et les échanges GEDCOM et médias à travers Next.js et le domaine métier.</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
.node{fill:#fff;stroke:#2d3142;stroke-width:1}.input{fill:rgba(79,93,117,.10);stroke:#7a8399}.store{fill:rgba(45,49,66,.05);stroke:#4f5d75}.external{fill:rgba(45,49,66,.03);stroke:rgba(45,49,66,.3);stroke-dasharray:4 3}.focal{fill:rgba(235,108,54,.08);stroke:#eb6c36;stroke-width:1.2}.zone{fill:rgba(45,49,66,.02);stroke:rgba(45,49,66,.12);stroke-width:.8}.name{font:600 12px Geist,sans-serif;fill:#2d3142}.sub{font:400 9px 'Geist Mono',monospace;fill:#4f5d75}.tag{font:500 8px 'Geist Mono',monospace;letter-spacing:.12em;fill:#7a8399}.arrow{fill:none;stroke:#4f5d75;stroke-width:1.2}.arrow-link{fill:none;stroke:#2e5aa8;stroke-width:1.2}.arrow-accent{fill:none;stroke:#eb6c36;stroke-width:1.2}.label-mask{fill:#f5f5f5}.label{font:500 8px 'Geist Mono',monospace;letter-spacing:.06em;fill:#7a8399}</style>
<marker id="flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
<marker id="flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="1040" height="560" fill="#f5f5f5"/>
<!-- lane backgrounds -->
<rect class="zone" x="24" y="72" width="992" height="112" rx="8"/><rect class="zone" x="24" y="208" width="992" height="112" rx="8"/><rect class="zone" x="24" y="344" width="992" height="112" rx="8"/>
<text class="tag" x="44" y="92">CONSULTATION</text><text class="tag" x="44" y="228">ADMINISTRATION</text><text class="tag" x="44" y="364">ÉCHANGES</text>
<!-- arrows behind nodes -->
<line class="arrow-link" x1="216" y1="136" x2="300" y2="136"/><line class="arrow-accent" x1="460" y1="136" x2="544" y2="136"/><line class="arrow" x1="704" y1="136" x2="788" y2="136"/>
<line class="arrow-accent" x1="216" y1="272" x2="300" y2="272"/><line class="arrow" x1="460" y1="272" x2="544" y2="272"/><line class="arrow" x1="704" y1="272" x2="788" y2="272"/>
<line class="arrow-link" x1="216" y1="408" x2="300" y2="408"/><line class="arrow-accent" x1="460" y1="408" x2="544" y2="408"/><line class="arrow" x1="704" y1="408" x2="788" y2="408"/>
<!-- labels -->
<rect class="label-mask" x="228" y="114" width="64" height="12" rx="2"/><text class="label" x="260" y="123" text-anchor="middle">REQUÊTE</text><rect class="label-mask" x="468" y="114" width="68" height="12" rx="2"/><text class="label" x="502" y="123" text-anchor="middle">PROJETTE</text><rect class="label-mask" x="712" y="114" width="68" height="12" rx="2"/><text class="label" x="746" y="123" text-anchor="middle">RETOURNE</text>
<rect class="label-mask" x="232" y="250" width="56" height="12" rx="2"/><text class="label" x="260" y="259" text-anchor="middle">VÉRIFIE</text><rect class="label-mask" x="472" y="250" width="60" height="12" rx="2"/><text class="label" x="502" y="259" text-anchor="middle">VALIDE</text><rect class="label-mask" x="720" y="250" width="52" height="12" rx="2"/><text class="label" x="746" y="259" text-anchor="middle">ÉCRIT</text>
<rect class="label-mask" x="232" y="386" width="56" height="12" rx="2"/><text class="label" x="260" y="395" text-anchor="middle">CHARGE</text><rect class="label-mask" x="472" y="386" width="60" height="12" rx="2"/><text class="label" x="502" y="395" text-anchor="middle">NORMALISE</text><rect class="label-mask" x="716" y="386" width="60" height="12" rx="2"/><text class="label" x="746" y="395" text-anchor="middle">PERSISTE</text>
<!-- consultation nodes -->
<rect class="input" x="56" y="104" width="160" height="64" rx="6"/><text class="tag" x="68" y="120">PUBLIC</text><text class="name" x="136" y="142" text-anchor="middle">Navigateur</text><text class="sub" x="136" y="158" text-anchor="middle">arbre · carte · fiches</text>
<rect class="focal" x="300" y="104" width="160" height="64" rx="6"/><text class="tag" x="312" y="120">NEXT</text><text class="name" x="380" y="142" text-anchor="middle">Pages serveur</text><text class="sub" x="380" y="158" text-anchor="middle">App Router</text>
<rect class="node" x="544" y="104" width="160" height="64" rx="6"/><text class="tag" x="556" y="120">CORE</text><text class="name" x="624" y="142" text-anchor="middle">web-api</text><text class="sub" x="624" y="158" text-anchor="middle">projections lecture</text>
<rect class="store" x="788" y="104" width="180" height="64" rx="6"/><text class="tag" x="800" y="120">SORTIE</text><text class="name" x="878" y="142" text-anchor="middle">Vue publique</text><text class="sub" x="878" y="158" text-anchor="middle">HTML · SVG · médias</text>
<!-- admin nodes -->
<rect class="input" x="56" y="240" width="160" height="64" rx="6"/><text class="tag" x="68" y="256">ADMIN</text><text class="name" x="136" y="278" text-anchor="middle">Formulaire</text><text class="sub" x="136" y="294" text-anchor="middle">édition · géocodage</text>
<rect class="focal" x="300" y="240" width="160" height="64" rx="6"/><text class="tag" x="312" y="256">GARDE</text><text class="name" x="380" y="278" text-anchor="middle">Session + action</text><text class="sub" x="380" y="294" text-anchor="middle">proxy · API</text>
<rect class="node" x="544" y="240" width="160" height="64" rx="6"/><text class="tag" x="556" y="256">CORE</text><text class="name" x="624" y="278" text-anchor="middle">admin-api</text><text class="sub" x="624" y="294" text-anchor="middle">règles métier</text>
<rect class="store" x="788" y="240" width="180" height="64" rx="6"/><text class="tag" x="800" y="256">PERSISTANCE</text><text class="name" x="878" y="278" text-anchor="middle">SQLite + fichiers</text><text class="sub" x="878" y="294" text-anchor="middle">données · médias</text>
<!-- exchange nodes -->
<rect class="input" x="56" y="376" width="160" height="64" rx="6"/><text class="tag" x="68" y="392">ENTRÉE</text><text class="name" x="136" y="414" text-anchor="middle">GEDCOM / média</text><text class="sub" x="136" y="430" text-anchor="middle">fichier utilisateur</text>
<rect class="focal" x="300" y="376" width="160" height="64" rx="6"/><text class="tag" x="312" y="392">CONTRÔLE</text><text class="name" x="380" y="414" text-anchor="middle">Route protégée</text><text class="sub" x="380" y="430" text-anchor="middle">taille · type · session</text>
<rect class="node" x="544" y="376" width="160" height="64" rx="6"/><text class="tag" x="556" y="392">DOMAINE</text><text class="name" x="624" y="414" text-anchor="middle">Parser / validation</text><text class="sub" x="624" y="430" text-anchor="middle">GEDCOM 5.5.1</text>
<rect class="store" x="788" y="376" width="180" height="64" rx="6"/><text class="tag" x="800" y="392">RÉSULTAT</text><text class="name" x="878" y="414" text-anchor="middle">Import / export</text><text class="sub" x="878" y="430" text-anchor="middle">base · archive</text>
<!-- legend -->
<line x1="40" y1="488" x2="1000" y2="488" stroke="rgba(45,49,66,.12)" stroke-width=".8"/><text class="tag" x="40" y="516">LÉGENDE</text><rect x="128" y="504" width="28" height="16" rx="4" fill="rgba(79,93,117,.10)" stroke="#7a8399"/><text class="sub" x="164" y="516">entrée</text><rect x="260" y="504" width="28" height="16" rx="4" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/><text class="sub" x="296" y="516">frontière</text><rect x="408" y="504" width="28" height="16" rx="4" fill="#fff" stroke="#2d3142"/><text class="sub" x="444" y="516">traitement</text><rect x="568" y="504" width="28" height="16" rx="4" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/><text class="sub" x="604" y="516">sortie / store</text>
</svg>
